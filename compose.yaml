name: ktor-realtime-api

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ktor_realtime}
      POSTGRES_USER: ${POSTGRES_USER:-realtime_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/Init-Env.ps1 or scripts/init-env.sh}
    ports:
      - "127.0.0.1:${PG_PORT:-55435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PORT: "8091"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ktor_realtime}
      DATABASE_USER: ${POSTGRES_USER:-realtime_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
      JWT_SECRET: ${JWT_SECRET:?Generate .env first}
      JWT_TTL_SECONDS: "3600"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Generate .env first}
    ports:
      - "127.0.0.1:${APP_PORT:-8091}:8091"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
